name: E Books

on:
  workflow_dispatch:
  # Runs at 00:00 UTC every Monday
  schedule:
    - cron: '24 23 * * *'
    - cron: '55 16 * * *'
    - cron: '8 17 * * *'
    - cron: '8 16 * * *'
    - cron: '35 23 * * *'
    - cron: '37 16 * * *'
    - cron: '35 11 * * *'

jobs:
  run-seo-script:
    runs-on: ubuntu-latest
    # Required to push changes back to the repository
    permissions:
      contents: write
    
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RYNX: ${{ secrets.RYNX }}
      PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
      PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        # Fetch all history so the hard reset works correctly
        fetch-depth: 0 

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r r.txt

    - name: Install Playwright Browsers
      run: |
        pip install playwright
        playwright install --with-deps

    - name: Run SEO Script
      run: python SEO/download.py

    - name: Run Main Script
      run: python ebook_main.py