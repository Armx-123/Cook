name: Videos

on:
  workflow_dispatch:
  schedule:
    - cron: '13 15 * * *'
    - cron: '8 19 * * *'
    - cron: '37 4 * * *'
    - cron: '29 9 * * *'
    - cron: '19 7 * * *'
    - cron: '39 2 * * *'
    - cron: '36 21 * * *'
    - cron: '32 13 * * *'
    - cron: '26 11 * * *'
    - cron: '40 10 * * *'

jobs:
  run-seo-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RYNX: ${{ secrets.RYNX }}
      PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
      PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Hugging Face Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-florence2
          restore-keys: |
            ${{ runner.os }}-hf-florence2-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r r.txt

      - name: Install Playwright Browsers
        run: |
          pip install playwright
          playwright install --with-deps

      - name: Install OpenVPN Client Backend
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn

      - name: Run SEO Script
        run: python SEO/download.py

      - name: Run Main Script
        run: python video_main.py