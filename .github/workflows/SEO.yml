name: SEO Download Script

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  # Runs at 00:00 UTC every Monday
  schedule:
    - cron: '0 0 * * 1'

jobs:
  run-seo-script:
    runs-on: ubuntu-latest
    # Required to push changes back to the repository
    permissions:
      contents: write
    
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RYNX: ${{ secrets.RYNX }}
      PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
      PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        # Fetch all history so the hard reset works correctly
        fetch-depth: 0 

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r r.txt

    - name: Install Playwright Browsers
      run: |
        pip install playwright
        playwright install --with-deps

    - name: Run SEO Script
      run: python SEO/download.py

    - name: Run Main Script
      run: python Files/SEO/main.py

    - name: Commit and Force-Overwrite Data
      run: |
        # Define the target data directory
        DATA_DIR="Data/Final_Strategy"

        # 1. Configure the GitHub Actions Bot Identity
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # 2. Back up the newly generated SEO data outside Git's tracking
        echo "Backing up fresh data..."
        mkdir -p /tmp/seo_backup
        # If the folder exists, copy everything. If not, don't crash.
        [ -d "$DATA_DIR" ] && cp -r "$DATA_DIR"/* /tmp/seo_backup/ || true
        
        # 3. Force Git to perfectly match the remote repository
        # This wipes out any local discrepancies and pulls the absolute newest remote state
        echo "Hard resetting to latest remote state..."
        git fetch origin main
        git reset --hard origin/main
        
        # 4. Bring the fresh data back in, physically overwriting the older remote files
        echo "Restoring fresh data..."
        mkdir -p "$DATA_DIR"
        cp -r /tmp/seo_backup/* "$DATA_DIR"/
        
        # 5. Stage the specific folder
        git add "$DATA_DIR"/*
        
        # 6. Check if the Python script actually changed any data
        if git diff --staged --quiet; then
          echo "No new SEO data generated. Skipping commit."
          exit 0
        fi
        
        # 7. Commit and Push
        git commit -m "Auto-update SEO data: ${{ github.run_id }}"
        git push origin main
