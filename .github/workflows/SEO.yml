name: SEO Download Script

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  # Runs at 00:00 UTC every Monday
  schedule:
    - cron: '0 0 * * 1'

jobs:
  run-seo-script:
    runs-on: ubuntu-latest
    # Required to push changes back to the repository
    permissions:
      contents: write
    
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RYNX: ${{ secrets.RYNX }}
      PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
      PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r SEO/requirements.txt

    - name: Install Playwright Browsers
      run: |
        pip install playwright
        playwright install --with-deps

    - name: Run SEO Script
      run: python SEO/download.py

    - name: Run Main Script
      run: python Files/SEO/main.py

    - name: Sync remote changes to prevent push rejection
      run: |
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            # Safely stash uncommitted data, pull the latest remote changes, and unstash
            git pull --rebase --autostash origin main
    
    - name: Commit and Force-Sync (Bot Wins Conflicts)
      run: |
        # 1. Configure the GitHub Actions Bot
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # 2. Stage only the SEO data folder
        git add Data/Final_Strategy/*
        
        # 3. Check if the Python script actually generated new data
        if git diff --staged --quiet; then
          echo "No new SEO data generated. Skipping commit."
          exit 0
        fi
        
        # 4. Save the bot's new data locally
        git commit -m "Auto-update SEO data: ${{ github.run_id }}"
        
        # 5. Pull the latest remote history. 
        # '-X theirs' tells Git: If there is a conflict, ALWAYS overwrite the remote data with the bot's data.
        git pull --rebase -X theirs origin main
        
        # 6. Push the finalized overwrites back to GitHub
        git push origin main
