name: Update Post Schedule

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Runs at 00:00 UTC every day

jobs:
  update-config:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate New Schedule
        run: |
          # Generate 3 random times in HH:MM format
          t1=$(printf "%02d:%02d" $((RANDOM%24)) $((RANDOM%60)))
          t2=$(printf "%02d:%02d" $((RANDOM%24)) $((RANDOM%60)))
          t3=$(printf "%02d:%02d" $((RANDOM%24)) $((RANDOM%60)))
          
          # Overwrite post.yml with the new array
          cat <<EOF > post.yml
          date: $(date +%Y-%m-%d)
          post_times:
            - "$t1"
            - "$t2"
            - "$t3"
          EOF

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update post.yml for $(date +%Y-%m-%d)"
          file_pattern: 'Post.yml'
